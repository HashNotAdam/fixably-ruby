name: Ruby

on: [push,pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"
    # The lockfile names mutant-license, which the Gemfile only asks for given a licence token, and CI has none, so a
    # frozen install would refuse it
    - name: Install dependencies
      run: bundle install
    - name: Run the default task
      run: bundle exec rake
